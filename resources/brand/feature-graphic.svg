<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="500" viewBox="0 0 1024 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0B1220"/>
      <stop offset="60%"  stop-color="#07090F"/>
      <stop offset="100%" stop-color="#04211F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="#00B8B8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#00B8B8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#00D4D4"/>
      <stop offset="100%" stop-color="#008A8A"/>
