<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#00B8B8">
<title>Offline — ShelTrify</title>
<style>
  :root {
    --bg: #EEF2F7; --card: #FFFFFF; --text: #1A2040;
    --muted: #5A6B8C; --border: #D8E0EC; --brand: #00B8B8;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #07090F; --card: #0C1018; --text: #E2E8F0;
      --muted: #8B9EC7; --border: #1B2440;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    max-width: 380px; width: 100%; text-align: center;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 40px 28px;
  }
  img { width: 72px; height: 72px; margin-bottom: 20px; }
  h1 { margin: 0 0 10px; font-size: 1.35rem; }
  p { margin: 0 0 24px; color: var(--muted); line-height: 1.6; font-size: 0.95rem; }
  button {
    width: 100%; padding: 13px 20px; font-size: 1rem; font-weight: 600;
    color: #fff; background: var(--brand); border: 0; border-radius: 12px; cursor: pointer;
  }
  button:active { opacity: .85; }
</style>
</head>
<body>
  <div class="card">
    <img src="/icons/icon-192.png" alt="ShelTrify">
    <h1>You're offline</h1>
    <p>ShelTrify needs an internet connection to load listings, the marketplace, and your wallet. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
  <script>
    addEventListener('online', () => location.reload());
  </script>
</body>
</html>
